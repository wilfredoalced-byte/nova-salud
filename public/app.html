<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Salud · Sistema de Botica</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo-mark sm">+</span> Nova Salud</div>
    <nav>
      <a href="#dashboard" data-view="dashboard">📊 Panel de control</a>
      <a href="#pos" data-view="pos">🛒 Punto de venta</a>
      <a href="#inventario" data-view="inventario">💊 Inventario</a>
      <a href="#alertas" data-view="alertas">🔔 Alertas <span class="badge" id="badgeAlertas">0</span></a>
      <a href="#ventas" data-view="ventas">🧾 Historial de ventas</a>
      <a href="#clientes" data-view="clientes">👥 Clientes</a>
    </nav>
    <div class="user-box">
      <div class="avatar" id="avatar">A</div>
      <div><b id="userName">—</b><small id="userRol">—</small></div>
      <button class="btn-link" id="btnSalir" title="Cerrar sesión">Salir</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn-icon" id="btnMenu" aria-label="Menú">☰</button>
      <h1 id="viewTitle">Panel de control</h1>
      <div class="live" id="liveStatus"><span class="dot"></span> En línea</div>
    </header>
    <section class="content" id="content"></section>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="btn-icon" data-action="cerrar-modal">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="js/app.js"></script>
</body>
</html>
